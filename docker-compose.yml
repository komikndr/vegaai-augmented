services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - MODE=dev
    volumes:
      - .:/app
    env_file:
      - .env
    ports:
      - '8000:8000'
    command: >
      sh -c '
        cd src && ./wait-for-it.sh postgres:5432 -t 60 --
        alembic upgrade head &&
          python -m chainlit run app.py --port 8000 --watch --host 0.0.0.0
        else
          python -m chainlit run app.py --port 8000 --host 0.0.0.0
        fi
      '
  postgres:
    image: postgres:16.1
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_VOLUME_PATH=${POSTGRES_STAGING_VOLUME_PATH}
    ports:
      - '5432:5432'
    volumes:
      - ${POSTGRES_VOLUME_PATH}:/var/lib/postgresql/data

  postgres_test:
    image: postgres:16.1
    environment:
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_password
      - POSTGRES_DB=test_db
    ports:
      - '5433:5432'
    volumes:
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql

  minio:
    image: minio/minio
    env_file:
      - .env
    environment:
      - MINIO_VOLUME_PATH=${MINIO_STAGING_VOLUME_PATH}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - ${MINIO_VOLUME_PATH}:/data

